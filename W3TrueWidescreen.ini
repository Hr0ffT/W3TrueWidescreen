; W3TrueWidescreen - unstretched widescreen for Warcraft III 1.26a
; All options are optional: delete a line and its default is used.

[W3TrueWidescreen]
; Screen aspect. Normally taken from the game's video settings (registry), so leave empty.
; Set Width/Height (or Aspect) only if the log says the window does not match.
;Width=2560
;Height=1080
;Aspect=2.3704

; 1 = the game world fills the whole screen, also behind the console (default)
; 0 = original black strips above and below the world view
WorldFullHeight=1

; 1 = keep the original 4:3 vertical field of view: 3D menu backgrounds and the game world look
;     exactly as far away as in 4:3, the extra width just shows more (default)
; 0 = engine default: the wider the screen, the more zoomed in
FovFix=1

; Extra camera zoom-out for the game world. 1.0 = original distance.
CameraZoomOut=1.0

; 1 = in-game hero portraits (top left) sit at the left screen edge (default)
; 0 = they stay with the centred console
HeroBarEdge=1

; 1 = the cinematic letterbox (talking heads, in-game cutscenes) spans the whole width (default)
; 0 = it stays in the centred 4:3 area
CinematicFullWidth=1

; 1 = menu panels move to the screen edges, like the original layout on a 4:3 screen (default)
; 0 = menus stay in the centred 4:3 area
MenuLayout=1

; 1 = 3D menu backgrounds fill the whole screen (default)
MenuBackgroundFull=1

; 1 = widen the black screen fade used by the campaign menu (default)
FadeFix=1

; ---- Cinematics (the pre-rendered movies) ----

; 1 = keep the desktop resolution and colours while a movie plays (default).
;     For every movie the game itself switches the screen to 800x600 and brightens it with a strong
;     gamma ramp, so the movies look blurry and washed out on a modern display.
; 0 = original behaviour
MovieNativeMode=1

; 1 = if the W3TrueWidescreen folder (MPC Video Renderer + LAV Filters) sits next to the game, the movies are
;     decoded and drawn by it instead of the Windows default: clean blacks, full screen at native
;     resolution, original Blizzard movie files play without extra codecs (default)
; 0 = Windows default renderer
MovieRenderer=1
; with MovieRenderer=1: NVIDIA RTX Video super resolution for the movies (RTX graphics cards)
MovieSuperRes=1

; Play the movies in an external player instead of the game:
; 0 = off (default), 1 = MPC-HC (found through its registry entry),
; or the full path to mpc-hc64.exe / mpc-be64.exe. The player runs fullscreen and closes at the end;
; Esc, Enter, Space or a click skip the movie, as in the game.
MoviePlayer=0

; ---- Other programs ----

; 1 = let other programs read the path of the game's exe (default). Warcraft III locks its process against
;     all access by other programs (an old anti-hack measure), so NVIDIA App cannot tell which game runs
;     and forgets RTX HDR and the other game filters. Memory access stays locked. The mod is loaded after
;     NVIDIA App checks the game at start, so select the profile once in the overlay (Alt+F3).
; 0 = original lock
AllowPathQuery=1

; 0 = do not touch menus and loading screens at all
Menus=1

; 1 = write a detailed W3TrueWidescreen.log (for bug reports)
Debug=0
