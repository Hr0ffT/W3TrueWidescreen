; W3TrueWidescreen - unstretched widescreen for Warcraft III 1.26a, 1.27b and 1.28.5
; All options are optional: delete a line and its default is used.

[W3TrueWidescreen]
; Screen aspect. Normally taken from the game's video settings (registry), so leave empty.
; Set Width/Height (or Aspect) only if the log says the window does not match.
;Width=2560
;Height=1080
;Aspect=2.3704

; 1 = the game world fills the whole screen, also behind the console (default)
; 0 = original black strips above and below the world view
WorldFullHeight=1

; 1 = keep the original 4:3 vertical field of view: 3D menu backgrounds and the game world look
;     exactly as far away as in 4:3, the extra width just shows more (default)
; 0 = engine default: the wider the screen, the more zoomed in
FovFix=1

; Extra camera zoom-out for the game world. 1.0 = original distance.
CameraZoomOut=1.0

; Size of the in-game interface, in percent (50..150). 100 = original size (default).
; Smaller values shrink the console, buttons, minimap, portraits and texts, so the world gets more room;
; useful on big screens. Menus keep their original size; the loading screen keeps its layout.
; Not on 4:3 screens.
UIScale=100

; 1 = the loading screen picture fills the whole screen (stretched to the screen's shape)
; 0 = it keeps its 4:3 shape, with black bars at the sides (default)
LoadingFullScreen=0

; Score screen background (after a game). Not on 4:3 screens.
; 1 = original: the 4:3 sheet between black bars
; 2 = the sheet extended to both screen edges, with its border on both sides
; 3 = the sheet stretched to the screen width below its header; header cells and tabs stay in place (default).
;     On screens wider than about 21:9 the sheet is extended as in 2 instead (stretched that far it gets blurred)
ScoreScreen=3

; The next three settings take an aspect ratio such as 16:9, 21:9, 4:3 or a number such as 1.78, for a centred area
; of that shape (on a screen not wider than it they change nothing). Empty = the whole screen (default).

; In-game hero portraits (top left) sit at the left edge of this area. 4:3 = next to the console
HeroBarAspect=

; The cinematic letterbox (talking heads, in-game cutscenes) spans this area. 4:3 = as in the original game
CinematicBarsAspect=

; The speaker's portrait, name and text in cinematics stay in this area (inside the letterbox)
CinematicDialogueAspect=

; Layout of the menu screens:
; 3 = menu panels at the screen edges; on the two-panel screens (custom game, LAN, game lobby, saved games, custom
;     campaigns, replays) the panels are widened towards the centre and meet there as on a 4:3 screen; the panels'
;     contents stay centred in the widened panels (default)
; 2 = as 3, but the contents move with the panels' inner edges to the screen centre (the lobby's stay at the edges)
; 1 = menu panels at the screen edges, as they are (a wide gap between the two panels on those screens)
; 0 = menus as in the original game (stretched over the screen); the 3D backgrounds stay unstretched
MenuLayout=3

; 1 = the 3D backgrounds of the menus are not stretched (default)
; 0 = they are stretched as in the original game
MenuBackgroundFull=1

; On screens wider than this, the menus (panels, buttons, logos) stay in a centred area of this shape instead of
; going to the screen edges, e.g. 16:9 on three monitors. The 3D backgrounds and the Battle.net login doors still
; fill the whole screen. Takes 16:9, 21:9 or a number such as 1.78. Works with MenuLayout 1 to 3. Empty = off
MenuAspect=

; ---- Cinematics (the pre-rendered movies) ----

; 1 = keep the desktop resolution and colours while a movie plays (default).
;     For every movie the game itself switches the screen to 800x600 and brightens it with a strong
;     gamma ramp, so the movies look blurry and washed out on a modern display.
; 0 = original behaviour
MovieNativeMode=1

; 1 = if the W3TrueWidescreen folder (MPC Video Renderer + LAV Filters) sits next to the game, the movies are
;     decoded and drawn by it instead of the Windows default: clean blacks, full screen at native
;     resolution, original Blizzard movie files play without extra codecs (default)
; 0 = Windows default renderer
MovieRenderer=1
; with MovieRenderer=1: NVIDIA RTX Video super resolution for the movies (RTX graphics cards)
MovieSuperRes=1
; with MovieRenderer=1: size of the movie subtitles (Subtitles on in the game's options), in percent
MovieSubtitleSize=100
; with MovieRenderer=1: brightness of the movie subtitles' white, in percent (lower it if they glare with HDR)
MovieSubtitleBrightness=100

; Play the movies in an external player instead of the game:
; 0 = off (default), 1 = MPC-HC (found through its registry entry),
; or the full path to mpc-hc64.exe / mpc-be64.exe. The player runs fullscreen and closes at the end;
; Esc, Enter, Space or a click skip the movie, as in the game.
MoviePlayer=0

; ---- Other programs ----

; 1 = let other programs read the path of the game's exe (default). Warcraft III locks its process against
;     all access by other programs (an old anti-hack measure), so NVIDIA App cannot tell which game runs
;     and forgets RTX HDR and the other game filters. Memory access stays locked. The mod is loaded after
;     NVIDIA App checks the game at start, so select the profile once in the overlay (Alt+F3).
; 0 = original lock
AllowPathQuery=1

; 0 = do not touch menus and loading screens at all
Menus=1

; A key that hides the whole interface in a game and shows it again, e.g. for screenshots: console, top bar,
; portraits, minimap, messages and the cursor disappear, the world fills the screen. Clicks still work as usual.
; The game itself does not get that key. Examples: Ctrl+H, Alt+H, F5, Pause, ScrollLock. Empty = off
HideUIKey=Ctrl+H

; Frame rate limit, e.g. 144 for a 144 Hz monitor. 0 = leave the game alone (its usual 64 fps).
; Only rendering changes: the game tick, timers and animations stepped per tick run exactly as before.
; If /fps in the game shows less than this, the monitor's refresh rate (vsync) or the GPU is the limit.
; Fullscreen: the game sets the display to its 'refreshrate' setting (60 by default) and waits for vsync.
; When that is below FpsLimit, the mod raises it to the monitor's highest rate at the game's resolution
; (HKEY_CURRENT_USER\Software\Blizzard Entertainment\Warcraft III\Video, refreshrate). 'maxfps' there does nothing.
FpsLimit=0


; 1 = DracoL1ch's DotA Allstars maps (7.0x) run as without the mod: they bring their own interface and their own
;     WideScreen option (in the map's settings), which the mod would only get in the way of. Their loading screen
;     picture is still stretched over the whole screen. 0 = the mod also works on these maps: their interface is laid
;     out over the wide screen and the 3D view is the one of their WideScreen option, over the full screen height
DotAOriginal=0
; 1 = write a detailed W3TrueWidescreen.log (for bug reports)
Debug=0
